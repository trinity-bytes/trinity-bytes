<svg xmlns="http://www.w3.org/2000/svg" width="360" height="64" viewBox="0 0 360 64" role="img" aria-label="Visit my portfolio: jahattrinidad.com">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#313244"/>
      <stop offset="1" stop-color="#1e1e2e"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cba6f7"/>
      <stop offset="0.55" stop-color="#b4befe"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cba6f7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#cba6f7" stop-opacity=".18"/>
      <stop offset="1" stop-color="#cba6f7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pill"><rect x="4" y="4" width="352" height="56" rx="28"/></clipPath>
  </defs>
  <style>
    .shine { animation: sweep 4.5s cubic-bezier(.45,0,.25,1) infinite; }
    .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 3s ease-in-out infinite; }
    .s2 { animation-delay: -1.1s; animation-duration: 3.6s; }
    .s3 { animation-delay: -2.2s; animation-duration: 2.8s; }
    .arrow { animation: nudge 2.25s ease-in-out infinite; }
    @keyframes sweep { 0%, 55% { transform: translateX(-140px); } 100% { transform: translateX(420px); } }
    @keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.7); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes nudge { 0%, 60%, 100% { transform: translateX(0); } 80% { transform: translateX(4px); } }
    @media (prefers-reduced-motion: reduce) { .shine, .spark, .arrow { animation: none; } .shine { opacity: 0; } }
  </style>
  <rect x="4" y="4" width="352" height="56" rx="28" fill="url(#fill)"/>
  <g clip-path="url(#pill)">
    <rect class="shine" x="0" y="0" width="90" height="64" fill="url(#shine)" transform="translate(-140 0)"/>
  </g>
  <rect x="5" y="5" width="350" height="54" rx="27" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <path class="spark" d="M34 22 L36.2 29.8 L44 32 L36.2 34.2 L34 42 L31.8 34.2 L24 32 L31.8 29.8 Z" fill="#f9e2af"/>
  <path class="spark s2" d="M300 14 L301 17 L304 18 L301 19 L300 22 L299 19 L296 18 L299 17 Z" fill="#b4befe"/>
  <path class="spark s3" d="M282 46 L282.8 48.2 L285 49 L282.8 49.8 L282 52 L281.2 49.8 L279 49 L281.2 48.2 Z" fill="#89b4fa"/>
  <text x="56" y="30" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#cdd6f4">Visit my portfolio</text>
  <text x="56" y="47" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#cba6f7">jahattrinidad.com</text>
  <g class="arrow">
    <circle cx="324" cy="32" r="18" fill="#cba6f7"/>
    <path d="M316 32 H331 M325 26 L331 32 L325 38" fill="none" stroke="#11111b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
