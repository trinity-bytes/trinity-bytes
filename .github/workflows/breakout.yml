name: Generate Breakout SVGs

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:

jobs:
  generate-svg:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Light SVG (Mauve Latte)
        uses: cyprieng/github-breakout@v1
        with:
          github_username: ${{ github.repository_owner }}
          output_path: output-light
          paddle_color: "#8839ef"
          ball_color: "#4c4f69"
          bricks_colors: "#e6e9ef,#cab4ef,#b288ef,#9b5cef,#8839ef"

      - name: Generate Dark SVG (Mauve Mocha)
        uses: cyprieng/github-breakout@v1
        with:
          github_username: ${{ github.repository_owner }}
          output_path: output-dark
          paddle_color: "#cba6f7"
          ball_color: "#cdd6f4"
          bricks_colors: "#313244,#5f557a,#8672a6,#ac8fd3,#cba6f7"

      - name: Move generated SVGs
        run: |
          mkdir -p assets/images/breakout
          mv output-light/custom.svg assets/images/breakout/breakout-light.svg
          mv output-dark/custom.svg assets/images/breakout/breakout-dark.svg

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push SVGs
        run: |
          git add assets/images/breakout/breakout-light.svg assets/images/breakout/breakout-dark.svg
          git commit -m "chore: update breakout SVGs" || echo "No changes to commit"
          git push
